<header class="py-5 z-50 bg-white/80 backdrop-blur-sm">

    <nav class="container fixed top-0 left-0 right-0  mx-auto px-6 h-20 flex items-center justify-between">

        <button (click)="onHackathon()"
            class="text-lg font-medium cinzel-links hover:text-gray-600 transition-colors">Hackathons</button>

        <button (click)="onLogo()">
            <app-logo-component></app-logo-component>
        </button>
        <button (click)="onProjects()" class="text-lg font-medium cinzel-links hover:text-gray-600 transition-colors">Projects</button>

    </nav>
    <!-- Hero Section - Redesigned -->
    <div class="hero-container">
        <!-- Animated gradient background -->
        <div class="hero-gradient"></div>

        <!-- Name - Signature Animation -->
        <h1 class="hero-name">
            <span class="signature-text">Zamokuhle Ndaba</span>
        </h1>

        <!-- Subtitle -->
        <p class="hero-subtitle">Software Developer & IT Specialist</p>

        <!-- Skill Progression Showcase -->
        <div class="skill-showcase">
            <div class="skill-header">
                <span class="skill-label">Specializing in</span>
                <span class="skill-name" [style.color]="currentSkill().color">
                    {{ currentSkill().name }}
                </span>
            </div>
            
            <!-- Progress Bar with Animation -->
            <div class="skill-progress-container">
                <div class="skill-progress-bg">
                    <div class="skill-progress-bar" 
                         [style.width.%]="currentSkill().level"
                         [style.background]="currentSkill().color">
                    </div>
                </div>
                <span class="skill-percentage">{{ currentSkill().level }}%</span>
            </div>

            <!-- All Skills Preview -->
            <div class="skills-grid">
                @for (skill of skills; track skill.name) {
                <div class="skill-pill" 
                     [class.active]="skill.name === currentSkill().name"
                     [style.border-color]="skill.name === currentSkill().name ? skill.color : 'transparent'">
                    {{ skill.name }}
                </div>
                }
            </div>
        </div>

        <!-- Role Badge -->
        <div class="role-badge">
            <span class="badge-dot"></span>
            Available for Projects
        </div>

        <!-- Social Links -->
        <div class="social-links">
            @for (tech of theTech(); track $index) {
            <a [href]="tech.title" target="_blank" rel="noopener noreferrer" class="social-icon">
                <img [src]="tech.icoImagUrl" [alt]="tech.title" width="20" height="20">
            </a>
            }
        </div>
    </div>
</header>
